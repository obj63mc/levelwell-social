[package]
name = "levelwell-social"
version = "0.0.3"
description = "LevelWell Social — Facebook & Instagram posting and scheduling for macOS"
authors = ["LevelWell"]
license = ""
repository = "https://github.com/obj63mc/levelwell-social"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "levelwell_social_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"

# Dev only: show our icon in the Dock when running the bare `tauri dev` binary
# (release builds get it from the .app bundle's icon.icns).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
objc2 = "0.6.4"
