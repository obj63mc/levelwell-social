[package]
name = "levelwell-social"
version = "0.1.0"
description = "LevelWell Social — Facebook & Instagram posting and scheduling for macOS"
authors = ["LevelWell"]
license = ""
repository = "https://github.com/obj63mc/levelwell-social"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "levelwell_social_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
